services:
  chaff:
    build:
      context: .
      # LLM SDKs baked in. Default covers Anthropic + OpenAI (a key pasted in
      # the UI just works). Add Google: set CHAFF_EXTRAS in .env, then rebuild.
      args:
        CHAFF_EXTRAS: ${CHAFF_EXTRAS:-api,nl,nl-openai}
    ports:
      - "8000:8000"
    # API keys for the "Describe it in English" button. Put one in .env
    # (see .env.example); empty here means "off" — the browser never sees it.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./out:/app/out
      - ./spec-library:/app/spec-library   # saved schemas persist across restarts

  # Phase 2 dev fixture (ADR-0005): a broker for kafka sink development.
  # Not a product dependency. `docker compose --profile streaming up`
  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Phase 6 dev fixture: a broker for mqtt sink development (Mosquitto).
  # Not a product dependency. Same `--profile streaming` as kafka. Anonymous
  # access on 1883 — a dev fixture, never a production posture.
  mqtt:
    profiles: ["streaming"]
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: >
      sh -c "printf 'listener 1883 0.0.0.0\nallow_anonymous true\n'
      > /mosquitto/config/mosquitto.conf
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
