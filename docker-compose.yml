services:
  chaff:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./out:/app/out
      - ./spec-library:/app/spec-library   # saved schemas persist across restarts

  # Phase 2 dev fixture (ADR-0005): a broker for kafka sink development.
  # Not a product dependency. `docker compose --profile streaming up`
  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
