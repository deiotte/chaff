services:
  chaff:
    build:
      context: .
      # LLM SDKs baked in. Default covers Anthropic + OpenAI (a key pasted in
      # the UI just works). Add Google: set CHAFF_EXTRAS in .env, then rebuild.
      args:
        CHAFF_EXTRAS: ${CHAFF_EXTRAS:-api,streaming,nl,nl-openai}
    # Bound to loopback on purpose: http://localhost:8000 works exactly as
    # before, but the container is not reachable from the rest of the network.
    # chaff's defaults (no auth) assume a single operator on localhost, so
    # publishing on 0.0.0.0 handed an unauthenticated API to the LAN. To expose
    # it deliberately, set CHAFF_API_TOKEN and CHAFF_BIND below.
    ports:
      - "${CHAFF_BIND:-127.0.0.1}:8000:8000"
    environment:
      # API keys for the "Describe it in English" button. Put one in .env
      # (see .env.example); empty here means "off" — the browser never sees it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Security settings documented in .env.example. These MUST be listed
      # here: the app reads them from the container's environment, so a value
      # in the host .env file alone reaches Compose but never the process —
      # which silently disabled every one of them.
      CHAFF_API_TOKEN: ${CHAFF_API_TOKEN:-}
      CHAFF_STREAM_ALLOWED_HOSTS: ${CHAFF_STREAM_ALLOWED_HOSTS:-}
      CHAFF_STREAM_MAX_RECORDS: ${CHAFF_STREAM_MAX_RECORDS:-}
      CHAFF_STREAM_MAX_SECONDS: ${CHAFF_STREAM_MAX_SECONDS:-}
      CHAFF_STREAM_MAX_SESSIONS: ${CHAFF_STREAM_MAX_SESSIONS:-}
      CHAFF_STREAM_HANDSHAKE_TIMEOUT: ${CHAFF_STREAM_HANDSHAKE_TIMEOUT:-}
      CHAFF_STREAM_ALLOW_LINK_LOCAL: ${CHAFF_STREAM_ALLOW_LINK_LOCAL:-}
      CHAFF_STREAM_EGRESS: ${CHAFF_STREAM_EGRESS:-}
      CHAFF_API_MAX_ROWS: ${CHAFF_API_MAX_ROWS:-}
      # Sink credentials belong in the environment, never in a saved spec.
      CHAFF_MQTT_USERNAME: ${CHAFF_MQTT_USERNAME:-}
      CHAFF_MQTT_PASSWORD: ${CHAFF_MQTT_PASSWORD:-}
      # Optional model overrides for the "Describe it in English" drafter.
      CHAFF_ANTHROPIC_MODEL: ${CHAFF_ANTHROPIC_MODEL:-}
      CHAFF_OPENAI_MODEL: ${CHAFF_OPENAI_MODEL:-}
      CHAFF_GOOGLE_MODEL: ${CHAFF_GOOGLE_MODEL:-}
    volumes:
      - ./out:/app/out
      - ./spec-library:/app/spec-library   # saved schemas persist across restarts

  # Phase 2 dev fixture (ADR-0005): a broker for kafka sink development.
  # Not a product dependency. `docker compose --profile streaming up`
  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Phase 6 dev fixture: a broker for mqtt sink development (Mosquitto).
  # Not a product dependency. Same `--profile streaming` as kafka. Anonymous
  # access on 1883 — a dev fixture, never a production posture.
  mqtt:
    profiles: ["streaming"]
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: >
      sh -c "printf 'listener 1883 0.0.0.0\nallow_anonymous true\n'
      > /mosquitto/config/mosquitto.conf
      && exec mosquitto -c /mosquitto/config/mosquitto.conf"
