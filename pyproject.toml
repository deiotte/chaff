[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaff"
version = "0.1.0"
description = "Spec-driven synthetic demo data engine. Fake signals convincing enough to work with."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karl Deiotte" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.5",
    "faker>=20.0",
    "typer>=0.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.141.1", "uvicorn[standard]>=0.27"]
formats-extra = ["openpyxl>=3.1.5", "pyarrow>=15", "fastavro>=1.9"]  # xlsx, parquet, avro
streaming = ["httpx>=0.27", "confluent-kafka>=2.15.0", "paho-mqtt>=2.0"]   # http + kafka + mqtt sinks
nl = ["anthropic>=0.40"]              # NL spec drafting via Anthropic (api/nl.py)
nl-openai = ["openai>=1.0"]           # ... or OpenAI (auto-detected by OPENAI_API_KEY)
nl-google = ["google-generativeai>=0.8"]  # ... or Google (GOOGLE_API_KEY)
dev = ["pytest>=8.0", "httpx>=0.27"]
# Browser-driven UI tests (ADR-0022). Optional on purpose: `make check` is the
# definition of green for every contributor, so tests/test_ui_browser.py skips
# when this isn't installed. CI installs it and runs them for real.
dev-browser = ["playwright>=1.40"]

[project.scripts]
chaff = "chaff.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
