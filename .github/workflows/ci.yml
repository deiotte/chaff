name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default (ADR-0031). The release jobs that publish
# assets re-declare the write scope they need; nothing else gets it.
permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (with extras)
        run: pip install -e '.[dev,dev-browser,api,formats-extra,streaming,nl]'
      # The browser-driven UI tests (ADR-0022) skip without a browser, which
      # would make them silently worthless in CI. Install one so `make check`
      # really does cover the page, not just the Python.
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: make check
        # A skipped browser test in CI is a hole, not a pass: this makes the
        # UI suite fail loudly if the browser install above ever breaks.
        env:
          CHAFF_REQUIRE_BROWSER_TESTS: "1"
        run: make check

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t chaff:ci .
