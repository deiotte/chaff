name: windows-exe

# Builds the one-click Windows chaff.exe (ADR-0014). PyInstaller can't
# cross-compile, so this runs on a real Windows runner. ci.yml is untouched.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    # Only when something that could break the build changes — not doc-only PRs.
    paths:
      - "packaging/**"
      - "api/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"

# Least privilege by default (ADR-0031). The release jobs that publish
# assets re-declare the write scope they need; nothing else gets it.
permissions:
  contents: read

jobs:
  build:
    name: build chaff.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install chaff + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,formats-extra,nl,nl-openai]"
          pip install pyinstaller pip-licenses

      - name: Regenerate third-party notices (must match the frozen env)
        run: |
          python packaging/gen_notices.py
          python packaging/gen_notices.py --check

      - name: Build onefile exe
        run: pyinstaller packaging/chaff.spec

      - name: Verify the exe launches and serves the UI
        # "The file exists" was the old bar. A frozen build that starts and
        # answers is the one that matters: a missing hidden import only shows
        # up at runtime, which is exactly what onefile builds get wrong.
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/chaff.exe")) { throw "chaff.exe not produced" }
          Copy-Item THIRD-PARTY-NOTICES.txt dist/
          Get-Item dist/chaff.exe | Format-List Name, Length

          $env:CHAFF_DESKTOP_PORT = "8123"   # don't guess at a fallback bind
          $env:CHAFF_NO_BROWSER = "1"        # headless runner
          $app = Start-Process -FilePath "dist/chaff.exe" -PassThru
          try {
            $up = $false
            foreach ($i in 1..90) {
              try {
                $reg = Invoke-RestMethod -Uri "http://127.0.0.1:8123/registry" -TimeoutSec 3
                if (-not $reg.desktop) { throw "desktop mode not armed in the frozen build" }
                Write-Host "exe serves /registry; desktop mode armed"
                $up = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw "chaff.exe did not start within 90s" }

            # Prove the Quit path works in the real build, not just in tests.
            Invoke-RestMethod -Uri "http://127.0.0.1:8123/shutdown" -Method Post -TimeoutSec 5 | Out-Null
            if (-not $app.WaitForExit(30000)) { throw "exe did not stop on /shutdown" }
            Write-Host "exe stopped via /shutdown"
          }
          finally {
            if (-not $app.HasExited) { $app.Kill() }
          }

      # ── Authenticode signing (ADR-0023) ──────────────────────────
      # Gated on secrets because a code-signing certificate is a purchase.
      # Without it the build still succeeds and ships an unsigned exe that
      # shows SmartScreen — the status quo — but says so loudly rather than
      # looking like it signed.
      # A pull request never signs (ADR-0031, red-team F-11). This workflow
      # runs on PRs so a broken build is caught before merge, which is worth
      # keeping — three WiX errors were found that way — but a build job and
      # a signing job want opposite things from a PR. Every signing step gates
      # on this one output, so the event check lives here and a step added
      # later inherits it instead of having to remember.
      #
      # The certificate is read through `env`, not interpolated into the
      # script body, and that expression yields an empty string on a PR — so
      # on a pull request the secret is not placed in the runner at all.
      - name: Check for signing credentials
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_PFX_BASE64 || '' }}
        run: |
          $available = -not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)
          "available=$($available.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -eq 'pull_request') {
            Write-Host "::notice title=Signing skipped::Pull requests build but never sign — the certificate is not exposed to PR runs. The tag build signs."
          } elseif (-not $available) {
            Write-Host "::warning title=Unsigned build::No WINDOWS_PFX_BASE64 secret; chaff.exe will be UNSIGNED and users will see the SmartScreen prompt. See docs/adr/0023-installers-and-signing.md."
          }

      - name: Sign chaff.exe
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "chaff-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found on the runner" }
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "chaff" /du "https://github.com/deiotte/chaff" dist/chaff.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
            & $signtool.FullName verify /pa /v dist/chaff.exe
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          }
          finally {
            # The private key must not outlive the step, even on failure.
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

      # ── MSI installer (Start-menu shortcut + uninstall entry) ────
      - name: Build MSI
        shell: pwsh
        run: |
          # Pinned, and pinned to the SAME version for both: `wix extension
          # add` rejects a wildcard ("Invalid extension version in
          # ...wixext/5.*") even though `dotnet tool install` accepts one, and
          # an extension built against a different wix version is unsupported.
          $wixVersion = "5.0.2"
          dotnet tool install --global wix --version $wixVersion
          wix extension add -g WixToolset.UI.wixext/$wixVersion
          python packaging/msi/make_license_rtf.py packaging/msi/license.rtf
          $version = "0.1.0.$($env:GITHUB_RUN_NUMBER)"
          # Named bind paths are `-b name=path` (the .wxs refers to them as
          # !(bindpath.name)); `-bindpath:name value` is not the v4/v5 syntax.
          wix build packaging/msi/chaff.wxs `
            -ext WixToolset.UI.wixext `
            -d Version=$version `
            -b exe=dist `
            -b msi=packaging/msi `
            -out dist/chaff.msi
          if (-not (Test-Path "dist/chaff.msi")) { throw "chaff.msi not produced" }
          Get-Item dist/chaff.msi | Format-List Name, Length

      # An unsigned MSI shows the same SmartScreen prompt the exe does, so it
      # is signed on exactly the same terms.
      - name: Sign chaff.msi
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "chaff-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "chaff installer" dist/chaff.msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          }
          finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaff-windows-exe
          path: |
            dist/chaff.exe
            dist/chaff.msi
            dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  release:
    name: attach exe to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chaff-windows-exe
          path: dist
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/chaff.exe
            dist/chaff.msi
            dist/THIRD-PARTY-NOTICES.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
